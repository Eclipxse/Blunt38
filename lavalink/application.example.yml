server:
  port: 2333
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Uncomment LavaSrc only when you want Spotify/Apple/Deezer link resolving.
    # Spotify still needs a free Spotify developer client ID and secret.
    # - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
    #   snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      # Lavalink's built-in YouTube source is deprecated. Use youtube-plugin above.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    # Give remote sources enough time to emit their first audio frames on a VPS.
    trackStuckThresholdMs: 30000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Authenticated TV playback is the lowest-latency option for YouTube links.
    # Use a burner account: the plugin authors warn that automated playback can
    # rate-limit or terminate the account. See lavalink/README.md for setup.
    oauth:
      enabled: false
      # refreshToken: "paste the burner account refresh token here"
    clients:
      # MUSIC handles ytmsearch metadata. TV becomes the fast playback client
      # after OAuth is enabled; the remaining clients are unauthenticated fallbacks.
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  # lavasrc:
  #   providers:
  #     - "ytsearch:%ISRC%"
  #     - "ytsearch:%QUERY%"
  #   sources:
  #     spotify: true
  #     applemusic: true
  #     deezer: true
  #     yandexmusic: false
  #   spotify:
  #     clientId: "paste_spotify_client_id"
  #     clientSecret: "paste_spotify_client_secret"
  #     countryCode: "US"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
